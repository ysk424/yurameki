schema_version = "1.0.0"

id = "yurameki"
version = "0.5.13"
name = "Yurameki"
tagline = "Yurameki (揺らめき) — CUDA hair solver prototype"
maintainer = "Yoshihiko Tsukamoto <ysk424@hotmail.com>"
type = "add-on"

blender_version_min = "5.1.0"

license = ["SPDX:MIT"]

tags = ["Physics"]

platforms = ["windows-x64"]

[build]
paths = [
    "__init__.py",
    "ui.py",
    "solver_interface.py",
    "initial_groom.py",
    "gravity_sim.py",
    "cuda_collider.py",
    "collider_proxy.py",
    "yurameki_defaults.json",
    "README.md",
    "DEVELOPMENT_NOTES.md",
    "LICENSE",
    "native/CMakeLists.txt",
    "native/build.ps1",
    "native/yurameki_cuda_collide.cu",
    "native/yurameki_cuda_collide.h",
    "native/yurameki_cuda_collide.dll",
]
